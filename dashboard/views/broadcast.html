<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排程發送 — 財富流動工作坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f5;
  color: #333;
}
.topbar {
  background: #1B0933;
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.back-btn { color: #ccc; text-decoration: none; font-size: 20px; }
.back-btn:hover { color: #fff; }
.topbar h1 { font-size: 18px; font-weight: 600; }
.container { max-width: 700px; margin: 0 auto; padding: 24px; }
.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
}
.card h2 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #1B0933;
}
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 6px;
  margin-top: 14px;
}
label:first-child { margin-top: 0; }
textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  min-height: 100px;
  resize: vertical;
}
textarea:focus { outline: none; border-color: #7B5BBE; }
select, input[type="datetime-local"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
}
select:focus, input:focus { outline: none; border-color: #7B5BBE; }
.preview-box {
  background: #f8f6ff;
  border: 1px solid #e0d4f5;
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 14px;
  font-size: 14px;
  color: #666;
}
.preview-box strong { color: #7B5BBE; }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-primary {
  flex: 1;
  padding: 14px;
  background: #7B5BBE;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:hover { background: #6A4CAE; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary {
  padding: 14px 24px;
  background: #eee;
  color: #666;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}
.btn-secondary:hover { background: #ddd; }
.history-item {
  background: #fff;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.history-content { flex: 1; min-width: 0; }
.history-text {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 6px;
  word-break: break-word;
}
.history-meta { font-size: 12px; color: #aaa; }
.history-meta span { margin-right: 12px; }
.status-badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.status-pending { background: #fff3e0; color: #e65100; }
.status-sent { background: #e8f5e9; color: #2e7d32; }
.status-failed { background: #ffebee; color: #c62828; }
.delete-btn {
  background: none;
  border: none;
  color: #ccc;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
}
.delete-btn:hover { color: #e74c3c; }
.empty { text-align: center; color: #aaa; padding: 30px; font-size: 14px; }
.char-count { font-size: 12px; color: #aaa; text-align: right; margin-top: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/dashboard/inbox" class="back-btn">&larr;</a>
  <h1>排程發送</h1>
</div>
<div class="container">
  <div class="card">
    <h2>新增排程訊息</h2>
    <label>訊息內容</label>
    <textarea id="content" placeholder="輸入要發送的訊息..."></textarea>
    <div class="char-count"><span id="charCount">0</span> 字</div>

    <label>發送對象</label>
    <select id="target" onchange="updatePreview()">
      <option value="all">所有聯絡人</option>
      <option value="stage">依對話階段篩選</option>
    </select>

    <div id="stageRow" style="display:none;">
      <label>選擇階段</label>
      <select id="targetStage" onchange="updatePreview()">
        <option value="catch">接住（0-2天）</option>
        <option value="warm">養溫（3-5天）</option>
        <option value="convert">轉化（5天+）</option>
      </select>
    </div>

    <label>發送時間</label>
    <select id="timeType" onchange="toggleTimeInput()">
      <option value="now">立即發送</option>
      <option value="schedule">排程發送</option>
    </select>
    <div id="scheduleRow" style="display:none; margin-top: 8px;">
      <input type="datetime-local" id="scheduledAt">
    </div>

    <div class="preview-box" id="previewBox">
      載入中...
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="sendBtn" onclick="createBroadcast()">確認發送</button>
    </div>
  </div>

  <div class="card">
    <h2>發送紀錄</h2>
    <div id="historyList"><div class="empty">載入中...</div></div>
  </div>
</div>
<script>
document.getElementById('content').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

document.getElementById('target').addEventListener('change', function() {
  document.getElementById('stageRow').style.display = this.value === 'stage' ? 'block' : 'none';
});

function toggleTimeInput() {
  const type = document.getElementById('timeType').value;
  document.getElementById('scheduleRow').style.display = type === 'schedule' ? 'block' : 'none';
}

async function updatePreview() {
  const target = document.getElementById('target').value;
  const stage = document.getElementById('targetStage').value;
  const params = new URLSearchParams({ target });
  if (target === 'stage') params.set('target_stage', stage);
  try {
    const res = await fetch('/api/broadcast/preview?' + params);
    const data = await res.json();
    const stageNames = { catch: '接住', warm: '養溫', convert: '轉化' };
    let text = '將發送給 <strong>' + data.count + ' 位</strong>聯絡人';
    if (target === 'stage') text += '（' + stageNames[stage] + '階段）';
    if (data.count > 0) {
      const names = data.contacts.slice(0, 5).map(c => c.display_name || '未知').join('、');
      text += '<br>' + names;
      if (data.count > 5) text += '...等';
    }
    document.getElementById('previewBox').innerHTML = text;
  } catch (e) {
    document.getElementById('previewBox').innerHTML = '無法載入預覽';
  }
}

async function createBroadcast() {
  const content = document.getElementById('content').value.trim();
  if (!content) { alert('請輸入訊息內容'); return; }

  const target = document.getElementById('target').value;
  const targetStage = target === 'stage' ? document.getElementById('targetStage').value : null;
  const timeType = document.getElementById('timeType').value;

  let scheduledAt;
  if (timeType === 'now') {
    scheduledAt = new Date().toISOString();
  } else {
    const val = document.getElementById('scheduledAt').value;
    if (!val) { alert('請選擇發送時間'); return; }
    scheduledAt = new Date(val).toISOString();
  }

  const action = timeType === 'now' ? '立即發送' : '排程發送';
  if (!confirm('確定要' + action + '嗎？')) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '處理中...';

  try {
    const res = await fetch('/api/broadcasts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, target, target_stage: targetStage, scheduled_at: scheduledAt }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || '發送失敗'); return; }
    alert('已建立！預計發送給 ' + data.recipient_count + ' 人');
    document.getElementById('content').value = '';
    document.getElementById('charCount').textContent = '0';
    loadHistory();
  } catch (e) {
    alert('操作失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '確認發送';
  }
}

async function loadHistory() {
  try {
    const res = await fetch('/api/broadcasts');
    const list = await res.json();
    const el = document.getElementById('historyList');
    if (list.length === 0) {
      el.innerHTML = '<div class="empty">還沒有發送紀錄</div>';
      return;
    }
    el.innerHTML = list.map(b => {
      const stageNames = { catch: '接住', warm: '養溫', convert: '轉化' };
      const targetText = b.target === 'stage' ? stageNames[b.target_stage] + '階段' : '全部';
      let statusClass = 'status-' + b.status;
      let statusText = b.status === 'pending' ? '待發送' : b.status === 'sent' ? '已發送' : b.status;
      let metaText = '對象：' + targetText;
      if (b.status === 'sent') metaText += ' | 成功 ' + b.sent_count + (b.fail_count > 0 ? ' 失敗 ' + b.fail_count : '');
      metaText += ' | ' + formatTime(b.status === 'sent' ? b.sent_at : b.scheduled_at);
      if (b.created_by) metaText += ' | ' + b.created_by;
      const deleteBtn = b.status === 'pending' ? '<button class="delete-btn" onclick="deleteBroadcast(' + b.id + ')" title="取消">&times;</button>' : '';
      return '<div class="history-item">' +
        '<div class="history-content">' +
          '<div class="history-text">' + escapeHtml(b.content.substring(0, 100)) + (b.content.length > 100 ? '...' : '') + '</div>' +
          '<div class="history-meta"><span>' + metaText + '</span></div>' +
        '</div>' +
        '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
        deleteBtn +
      '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('historyList').innerHTML = '<div class="empty">載入失敗</div>';
  }
}

async function deleteBroadcast(id) {
  if (!confirm('確定要取消這則排程訊息嗎？')) return;
  await fetch('/api/broadcasts/' + id, { method: 'DELETE' });
  loadHistory();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

updatePreview();
loadHistory();
</script>
</body>
</html>
